<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Live Fleet — Lift Club JHB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#e8e6e0;font-family:'Inter',sans-serif;overflow:hidden}
#map{position:absolute;inset:0;z-index:1}
.map-vignette{position:absolute;inset:0;z-index:2;pointer-events:none;background:
  radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.14) 100%);}

.topbar{position:absolute;top:0;left:0;right:0;z-index:10;padding:18px 18px 40px;
  background:linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.5) 60%, transparent 100%);
  display:flex;justify-content:space-between;align-items:flex-start}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#22c55e,#16a34a);display:flex;align-items:center;justify-content:center;font-size:1.1rem;box-shadow:0 4px 16px rgba(34,197,94,0.4)}
.brand-text .eyebrow{font-family:'Bebas Neue',sans-serif;font-size:0.72rem;letter-spacing:0.12em;color:#999}
.brand-text .title{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:#fff;letter-spacing:0.02em;margin-top:-2px}
.back-btn{background:rgba(255,255,255,0.08);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.15);color:#fff;width:38px;height:38px;border-radius:10px;font-size:1.2rem;display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0}

.live-pill{position:absolute;top:78px;left:18px;z-index:10;background:rgba(20,20,20,0.65);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border:1px solid rgba(255,255,255,0.12);border-radius:100px;padding:9px 16px 9px 12px;display:flex;align-items:center;gap:9px;box-shadow:0 8px 24px rgba(0,0,0,0.35)}
.live-dot{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,0.7);animation:livePulse 1.6s infinite}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,0.6)}70%{box-shadow:0 0 0 9px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.live-text{font-size:0.78rem;font-weight:700;color:#fff;letter-spacing:0.02em}
.live-count{font-size:0.78rem;color:#8de9a8;font-weight:700}

.bottom-sheet{position:absolute;bottom:0;left:0;right:0;z-index:10;padding:16px 18px calc(18px + env(safe-area-inset-bottom));
  background:linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 70%, transparent 100%)}
.bottom-inner{background:rgba(20,20,20,0.65);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid rgba(255,255,255,0.12);border-radius:16px;padding:16px 18px;box-shadow:0 8px 30px rgba(0,0,0,0.4)}
.bottom-title{font-family:'Bebas Neue',sans-serif;font-size:1.05rem;color:#fff;letter-spacing:0.02em;margin-bottom:4px}
.bottom-sub{font-size:0.78rem;color:#999;line-height:1.4}

.leaflet-container{background:#e8e6e0}

.car-wedge-wrap{width:22px;height:22px;position:relative}
.car-glow{position:absolute;inset:-9px;border-radius:50%;background:radial-gradient(circle,rgba(34,197,94,0.4) 0%,transparent 70%);animation:carGlow 2.4s infinite}
@keyframes carGlow{0%,100%{opacity:0.5;transform:scale(0.85)}50%{opacity:0.9;transform:scale(1.15)}}
.car-wedge{width:22px;height:22px;transition:transform 0.15s linear}
.car-body{width:14px;height:14px;margin:4px;border-radius:4px 4px 8px 8px;background:linear-gradient(160deg,#4ade80,#16a34a);border:1.5px solid rgba(255,255,255,0.85);box-shadow:0 2px 8px rgba(0,0,0,0.5)}
.car-body.idle{background:linear-gradient(160deg,#fbbf24,#d97706)}

.request-ping{width:16px;height:16px;border-radius:50%;background:rgba(245,166,35,0.9);box-shadow:0 0 0 0 rgba(245,166,35,0.7);animation:requestPing 1.8s ease-out forwards}
@keyframes requestPing{0%{transform:scale(0.4);opacity:1;box-shadow:0 0 0 0 rgba(245,166,35,0.6)}70%{opacity:0.8}100%{transform:scale(2.2);opacity:0;box-shadow:0 0 0 22px rgba(245,166,35,0)}}
</style>
</head>
<body>

<div id="map"></div>
<div class="map-vignette"></div>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">🚗</div>
    <div class="brand-text">
      <div class="eyebrow">LIFT CLUB JHB</div>
      <div class="title">Live Fleet</div>
    </div>
  </div>
  <a href="javascript:history.back()" class="back-btn">&times;</a>
</div>

<div class="live-pill">
  <div class="live-dot"></div>
  <div class="live-text">LIVE</div>
  <div class="live-count" id="liveCount">— drivers active</div>
</div>

<div class="bottom-sheet">
  <div class="bottom-inner">
    <div class="bottom-title" id="bottomTitle">Drivers roaming across Johannesburg</div>
    <div class="bottom-sub" id="bottomSub">This is a live snapshot of activity across our network.</div>
  </div>
</div>

<script>
const CENTER = [-26.1160, 28.0580]; // Sandton / Rosebank / Melrose core
const HOTSPOTS = [
  { name: 'Sandton', lat: -26.1076, lng: 28.0567 },
  { name: 'Rosebank', lat: -26.1467, lng: 28.0436 },
  { name: 'Melrose Arch', lat: -26.1323, lng: 28.0687 },
  { name: 'Fourways', lat: -26.0170, lng: 28.0100 }
];
const NUM_CARS = 22;
const METERS_PER_DEG_LAT = 111320;

let map;
let cars = [];

function metersToLat(m) { return m / METERS_PER_DEG_LAT; }
function metersToLng(m, lat) { return m / (METERS_PER_DEG_LAT * Math.cos(lat * Math.PI / 180)); }

function randomOffset(baseLat, baseLng, radiusM) {
  const angle = Math.random() * Math.PI * 2;
  const dist = Math.random() * radiusM;
  return {
    lat: baseLat + metersToLat(Math.sin(angle) * dist),
    lng: baseLng + metersToLng(Math.cos(angle) * dist, baseLat)
  };
}

function bearing(a, b) {
  const toRad = d => d * Math.PI / 180;
  const y = Math.sin(toRad(b.lng - a.lng)) * Math.cos(toRad(b.lat));
  const x = Math.cos(toRad(a.lat)) * Math.sin(toRad(b.lat)) - Math.sin(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.cos(toRad(b.lng - a.lng));
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

function lerp(a, b, t) { return a + (b - a) * t; }

function initMap() {
  map = L.map('map', { zoomControl: false, attributionControl: false }).setView(CENTER, 14);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd', maxZoom: 19
  }).addTo(map);
  L.control.zoom({ position: 'bottomright' }).addTo(map);
}

function makeCarIcon() {
  return L.divIcon({
    className: '',
    html: `<div class="car-wedge-wrap"><div class="car-glow"></div><div class="car-wedge"><div class="car-body"></div></div></div>`,
    iconSize: [22, 22],
    iconAnchor: [11, 11]
  });
}

function spawnCar(i) {
  const useHotspot = Math.random() < 0.65;
  const spot = HOTSPOTS[Math.floor(Math.random() * HOTSPOTS.length)];
  const origin = useHotspot
    ? randomOffset(spot.lat, spot.lng, 550)
    : randomOffset(CENTER[0], CENTER[1], 3200);

  const marker = L.marker([origin.lat, origin.lng], { icon: makeCarIcon() }).addTo(map);
  const trail = L.polyline([[origin.lat, origin.lng]], { color: '#22c55e', weight: 2, opacity: 0.28 }).addTo(map);

  const car = {
    marker, trail,
    homeSpot: useHotspot ? spot : null,
    from: origin, to: origin,
    startTime: performance.now(),
    duration: 1,
    state: 'idle',
    points: [[origin.lat, origin.lng]],
    el: null, wedgeEl: null, bodyEl: null
  };
  pickNextLeg(car, true);
  return car;
}

function pickNextLeg(car, first) {
  const now = performance.now();
  car.from = first ? car.from : car.to;

  const roll = Math.random();
  let target;

  if (roll < 0.18) {
    car.state = 'idle';
    car.to = car.from;
    car.duration = 2500 + Math.random() * 3500;
  } else if (roll < 0.32 && car._prevFrom) {
    car.state = 'uturn';
    target = car._prevFrom;
    car.to = target;
    car.duration = 1800 + Math.random() * 1500;
  } else {
    car.state = 'driving';
    const base = car.homeSpot && Math.random() < 0.6 ? car.homeSpot : car.from;
    const radius = car.homeSpot ? 700 : 900;
    target = randomOffset(base.lat, base.lng, radius);
    car.to = target;
    const distM = Math.hypot(
      (target.lat - car.from.lat) * METERS_PER_DEG_LAT,
      (target.lng - car.from.lng) * METERS_PER_DEG_LAT * Math.cos(target.lat * Math.PI / 180)
    );
    car.duration = Math.max(1600, Math.min(6000, distM * 12));
  }

  car._prevFrom = car.from;
  car.startTime = now;

  if (car.state !== 'idle') {
    const brg = bearing(car.from, car.to);
    if (car.wedgeEl) car.wedgeEl.style.transform = `rotate(${brg}deg)`;
  }
  if (car.bodyEl) car.bodyEl.classList.toggle('idle', car.state === 'idle');
}

function animateCars(now) {
  cars.forEach(car => {
    const t = Math.min(1, (now - car.startTime) / car.duration);
    const lat = lerp(car.from.lat, car.to.lat, t);
    const lng = lerp(car.from.lng, car.to.lng, t);
    car.marker.setLatLng([lat, lng]);

    if (car.state === 'driving' || car.state === 'uturn') {
      car.points.push([lat, lng]);
      if (car.points.length > 12) car.points.shift();
      car.trail.setLatLngs(car.points);
    }

    if (t >= 1) pickNextLeg(car, false);
  });

  requestAnimationFrame(animateCars);
}

function cacheCarElements() {
  cars.forEach(car => {
    const el = car.marker.getElement();
    if (el) {
      car.el = el;
      car.wedgeEl = el.querySelector('.car-wedge');
      car.bodyEl = el.querySelector('.car-body');
    }
  });
}

function spawnRequestPings() {
  setInterval(() => {
    const spot = HOTSPOTS[Math.floor(Math.random() * HOTSPOTS.length)];
    const p = randomOffset(spot.lat, spot.lng, 800);
    const icon = L.divIcon({ className: '', html: '<div class="request-ping"></div>', iconSize: [16, 16], iconAnchor: [8, 8] });
    const marker = L.marker([p.lat, p.lng], { icon, interactive: false }).addTo(map);
    setTimeout(() => map.removeLayer(marker), 1900);
  }, 2200);
}

function fluctuateCount() {
  const base = NUM_CARS;
  setInterval(() => {
    const n = base + Math.floor(Math.random() * 5) - 2;
    document.getElementById('liveCount').textContent = n + ' drivers active';
  }, 4000);
}

function init() {
  initMap();
  cars = [];
  for (let i = 0; i < NUM_CARS; i++) cars.push(spawnCar(i));
  setTimeout(cacheCarElements, 200);
  document.getElementById('liveCount').textContent = NUM_CARS + ' drivers active';
  requestAnimationFrame(animateCars);
  spawnRequestPings();
  fluctuateCount();
}

init();
</script>
</body>
</html>
